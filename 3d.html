<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Coverflow Slider</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />

    <style>
      .swiper {
        padding-top: 40px;
        padding-bottom: 60px;
      }

      .swiper-slide {
        background-position: center;
        background-size: cover;
        width: 300px;
        height: 400px;
        display: flex;
        align-items: flex-end;
        color: white;
        padding: 20px;
      }
    </style>
  </head>
  <body class="bg-gray-100">

    <section class="max-w-7xl mx-auto px-4 py-16">
      <h2 class="text-2xl font-bold mb-8">Case Studies</h2>

      <!-- Slider -->
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide bg-cover bg-center" style="background-image:url('https://source.unsplash.com/random/1')">
            <div>
              <p class="text-lg font-semibold">AI-Powered Predictive Analytics</p>
              <a href="#" class="text-orange-500 text-sm mt-2 inline-block">View Details →</a>
            </div>
          </div>
          <div class="swiper-slide" style="background-image:url('https://source.unsplash.com/random/2')"></div>
          <div class="swiper-slide" style="background-image:url('https://source.unsplash.com/random/3')"></div>
          <div class="swiper-slide" style="background-image:url('https://source.unsplash.com/random/4')"></div>
        </div>

        <!-- Pagination -->
        <div class="swiper-pagination mt-6"></div>

        <!-- Navigation -->
        <div class="flex justify-end gap-4 mt-4">
          <div class="swiper-button-prev border rounded-full w-10 h-10 flex items-center justify-center"></div>
          <div class="swiper-button-next border border-orange-500 text-orange-500 rounded-full w-10 h-10 flex items-center justify-center"></div>
        </div>
      </div>
    </section>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>

    <!-- Init Swiper -->
    <script>
      const swiper = new Swiper(".mySwiper", {
        effect: "coverflow",
        grabCursor: true,
        centeredSlides: true,
        loop: true,
        slidesPerView: "auto",
        coverflowEffect: {
          rotate: 50,
          stretch: 0,
          depth: 100,
          modifier: 1,
          slideShadows: true,
        },
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>

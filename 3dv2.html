<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Coverflow Slider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css"
    />
    <style>
    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 300px;
      height: 400px;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      position: relative;
    }
    .swiper-slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
      z-index: 1;
    }
    .swiper-slide div {
      position: relative;
      z-index: 2;
    }
  </style>
  </head>
  <body class="bg-gray-100">
    <section class="max-w-7xl mx-auto px-4 py-16 relative">
    <h2 class="text-3xl font-bold mb-10 text-gray-800">Case Studies</h2>

    <!-- Custom Navigation Arrows -->
    <div class="absolute top-20 right-4 flex space-x-4 z-10">
      <button class="swiper-button-prev-custom w-10 h-10 border border-gray-300 rounded-full flex items-center justify-center hover:bg-gray-200 transition">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <button class="swiper-button-next-custom w-10 h-10 border border-gray-300 rounded-full flex items-center justify-center hover:bg-gray-200 transition">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

      <!-- Swiper Container -->
      <div class="relative">
        <div class="swiper mySwiper">
          <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide" style="background-image:url('3d.jpg')">
              <div>AI Predictive Analytics</div>
            </div>
            <div class="swiper-slide" style="background-image:url('3d.jpg')">
              <div>Cloud Computing</div>
            </div>
            <div class="swiper-slide" style="background-image:url('3d.jpg')">
              <div>VR Innovation</div>
            </div>
            <div class="swiper-slide" style="background-image:url('3d.jpg')">
              <div>IoT Devices</div>
            </div>
            <div class="swiper-slide" style="background-image:url('3d.jpg')">
              <div>Cybersecurity</div>
            </div>
            <div class="swiper-slide" style="background-image:url('3d.jpg')">
              <div>Data Analysis</div>
            </div>
            <div class="swiper-slide" style="background-image:url('3d.jpg')">
              <div>UX Design</div>
            </div>
            <div class="swiper-slide" style="background-image:url('3d.jpg')">
              <div>Machine Learning</div>
            </div>
          </div>

          <!-- Pagination -->
          <div class="swiper-pagination mt-6"></div>
        </div>



      </div>
    </section>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>

    <script>
      const swiper = new Swiper('.mySwiper', {
        effect: 'coverflow',
        grabCursor: true,
        centeredSlides: true,
        loop: true,
        slidesPerView: 'auto',
        coverflowEffect: {
          rotate: 50,
          stretch: 0,
          depth: 100,
          modifier: 1,
          slideShadows: true,
        },
        autoplay: {
          delay: 3500,
          disableOnInteraction: false,
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
        navigation: {
        nextEl: '.swiper-button-next-custom',
        prevEl: '.swiper-button-prev-custom',
        },

      });
    </script>
  </body>
</html>
